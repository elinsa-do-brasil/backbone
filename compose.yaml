services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: backbone
      POSTGRES_USER: backbone
      POSTGRES_PASSWORD: backbone
    ports:
      - "5432:5432"
    volumes:
      - backbone-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U backbone -d backbone"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  backbone-postgres: